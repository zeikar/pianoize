[project]
name = "pianoize"
version = "0.1.0"
description = "Turn a song recording into a piano arrangement, rendered as falling notes."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "zeikar" }]
dependencies = [
  "mido>=1.3",
  "numpy>=1.26",
  "soundfile>=0.12",
  "typer>=0.12",
]

[project.scripts]
pianoize = "pianoize.cli:app"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pianoize"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "fluidsynth: renders with the real FluidSynth; needs it on PATH and PIANOIZE_SOUNDFONT",
  "video: captures with the installed Chrome, node and ffmpeg; slow",
]
