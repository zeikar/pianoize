# Publishes the viewer page to GitHub Pages. Only the page's own files go up: not the capture
# script, the tests or the npm files.
name: Pages

on:
  push:
    branches: [main]
    paths: [viewer/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - run: mkdir _site && cp viewer/index.html viewer/*.css viewer/*.js _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
